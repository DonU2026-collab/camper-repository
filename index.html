:root{
  --surface:#ffffff; --surface-warm:#f6f2ea; --surface-card:#ffffff;
  --ink:#253745; --ink-strong:#11212d; --ink-muted:#4a5c6a;
  --accent:#8f7230; --border:#ccd0cf;
  --field:#4a5c6a; --bar:#4a5c6a; --press:#e8dfcf; --scrim:rgba(6,20,27,.55);
  --font:"Lato",Calibri,Arial,sans-serif;
  --r-sm:2px; --r-md:4px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --surface:#11212d; --surface-warm:#06141b; --surface-card:#253745;
    --ink:#ffffff; --ink-strong:#ffffff; --ink-muted:#9ba8ab;
    --accent:#d4b365; --border:#4a5c6a;
    --field:#9ba8ab; --bar:#9ba8ab; --press:#06141b; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --surface:#11212d; --surface-warm:#06141b; --surface-card:#253745;
  --ink:#ffffff; --ink-strong:#ffffff; --ink-muted:#9ba8ab;
  --accent:#d4b365; --border:#4a5c6a;
  --field:#9ba8ab; --bar:#9ba8ab; --press:#06141b; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--surface-warm); color:var(--ink);
  font:400 14px/1.3 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px 112px;
  min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.app{max-width:960px;margin:0 auto}
:focus-visible{outline:2px solid var(--ink-strong);outline-offset:2px}
.panel:focus{outline:none}
.ico{display:block;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Kopf */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.top h1{font-weight:700;font-size:clamp(24px,6vw,32px);line-height:1.15;color:var(--ink-strong)}
.top h1::after{content:"";display:block;width:32px;height:2px;background:var(--accent);margin-top:8px}
.vsel{position:relative;min-width:0;max-width:100%}
.vsel select{appearance:none;-webkit-appearance:none;background:var(--surface-card);border:1px solid var(--field);border-radius:var(--r-sm);
  height:44px;padding:0 40px 0 12px;font-size:16px;font-weight:700;color:var(--ink-strong);max-width:100%}
.vsel .ico{position:absolute;right:10px;top:10px;pointer-events:none;color:var(--ink-muted)}

/* Abschnitte */
.sec{display:flex;align-items:center;gap:10px;margin:32px 0 16px;font-weight:700;font-size:16px;color:var(--ink-strong)}
.slash{width:2px;height:16px;background:var(--accent);transform:rotate(15deg);flex:none}
.sec .grow{flex:1}
.link{background:none;border:0;padding:8px 0;color:var(--ink-strong);text-decoration:underline;text-underline-offset:3px;font-size:14px;min-height:44px}

/* Schnellaktionen */
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.qa{display:flex;flex-direction:column;gap:12px;align-items:flex-start;text-align:left;min-height:116px;padding:16px;
  background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-md);color:var(--ink-strong)}
.qa:hover,.qa:active{background:var(--press)}
.qa .ico{color:var(--ink-muted)}
.qa b{font-size:16px;font-weight:700;display:block}
.qa small{display:block;font-size:12px;color:var(--ink-muted);margin-top:4px}

/* Kennzahlen */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stat{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;min-width:0}
.stat .k{font-size:13px;color:var(--ink-muted)}
.stat .v{font-weight:300;font-size:40px;line-height:1.1;color:var(--ink-muted);margin-top:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

<body>

<div class="app"><main id="main" tabindex="-1"></main></div>

<nav class="tabs" aria-label="Hauptnavigation">
  <div class="brand">Camper Repository</div>
  <button class="tab" data-tab="home"><span data-ico="home"></span><span>Start</span></button>
  <button class="tab" data-tab="log"><span data-ico="list"></span><span>Verlauf</span></button>
  <button class="add" id="add" aria-label="Neuer Eintrag"><span data-ico="plus"></span><span class="add-l">Neuer Eintrag</span></button>
  <button class="tab" data-tab="stats"><span data-ico="chart"></span><span>Auswertung</span></button>
  <button class="tab" data-tab="more"><span data-ico="dots"></span><span>Mehr</span></button>
</nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
/* ---------- Hilfsfunktionen ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const _nf={};
const nf=d=>_nf[d]||(_nf[d]=new Intl.NumberFormat("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d}));
const fmt=(n,d=0)=>(n==null||!isFinite(n))?"–":nf(d).format(n);
const eur=(n,d=2)=>(n==null||!isFinite(n))?"–":nf(d).format(n)+" €";
const p2=n=>String(n).padStart(2,"0");
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
const fmtDate=iso=>{const [y,m,d]=iso.split("-");return d+"."+m+"."+y};
const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const addDays=(iso,n)=>{const [y,m,d]=iso.split("-").map(Number);const t=new Date(Date.UTC(y,m-1,d+n));return t.getUTCFullYear()+"-"+p2(t.getUTCMonth()+1)+"-"+p2(t.getUTCDate())};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10));
function num(s){
  s=String(s??"").trim().replace(/\s/g,"");if(!s)return NaN;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  else if((s.match(/\./g)||[]).length>1) s=s.replace(/\./g,"");
  const n=parseFloat(s);return isFinite(n)?n:NaN;
}
const intOf=s=>{const t=String(s??"").replace(/\D/g,"");return t?parseInt(t,10):NaN};
const toField=(n,d)=>(n==null||!isFinite(n))?"":n.toFixed(d).replace(".",",");

/* ---------- Icons: 24-px-Raster, Linie 1,5 px, eckige Enden, ohne Füllung ---------- */
const I={
  fuel:'<path d="M4 21V3.5h9V21M2.5 21h12M6.5 7h4v4h-4zM13 8.5h2.5l2 2v6.5a1.75 1.75 0 0 0 3.5 0V8.5L19 5.5"/>',
  adblue:'<path d="M12 3l6 8.5a6.5 6.5 0 1 1-12 0z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/>',
  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  pin:'<path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.5"/>',
  home:'<path d="M3 11.5L12 4l9 7.5V21H3z"/><path d="M9.5 21v-6h5v6"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/>',
  chart:'<path d="M3 21h18M6 21v-7M11 21V6M16 21v-10M21 21v-4"/>',
  dots:'<path d="M4 11h2v2H4zM11 11h2v2h-2zM18 11h2v2h-2z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  chev:'<path d="M6 9l6 6 6-6"/>',
  cam:'<path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="3.5"/>',
  down:'<path d="M12 4v11M7 11l5 5 5-5M4 20h16"/>',
  up:'<path d="M12 16V5M7 9l5-5 5 5M4 20h16"/>',
  cloud:'<path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/>',
  car:'<path d="M3 16v-4l2-5h14l2 5v4zM3 16v3h3v-3M18 16v3h3v-3M6 12h12"/>',
  warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 17.5v.5"/>',
  star:'<path d="M12 3.5l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 9.8l6-.7z"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/>',
  check:'<path d="M4 12.5l5 5L20 6.5"/>'
};
const ico=(n,s=24)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">${I[n]}</svg>`;

/* ---------- Speicher: IndexedDB mit Fallback auf den Arbeitsspeicher ---------- */
const DB={db:null,mem:{},ok:false,
  async open(){
    try{
      this.db=await new Promise((res,rej)=>{const r=indexedDB.open("camper-repository",1);
        r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
      this.ok=true;
    }catch(e){this.db=null;this.ok=false}
  },
  get(k){
    if(!this.db)return Promise.resolve(this.mem[k]);
    return new Promise(res=>{try{const q=this.db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(this.mem[k])}catch(e){res(this.mem[k])}});
  },
  set(k,v){
    this.mem[k]=v;if(!this.db)return Promise.resolve();
    return new Promise(res=>{try{const t=this.db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}});
  },
  del(k){
    delete this.mem[k];if(!this.db)return Promise.resolve();
    return new Promise(res=>{try{const t=this.db.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}});
  }
};

/* ---------- Datenmodell ----------
   Ein Eintrag hat immer Fahrzeug, Datum, optional Kilometerstand und Kosten. Typen: fuel, adblue, expense, stay.
   Jeder Eintrag trägt id, updatedAt und deleted. Das ist die Grundlage für den späteren Abgleich zwischen Geräten. */
const CATS=["Wartung & Reparatur","Versicherung & Steuern","Maut & Fähre","Gas & Betriebsmittel","Ausrüstung","Sonstiges"];
const KINDS=["Campingplatz","Stellplatz","Sonstiger Ort"];
let S=null, tab="home", logFilter="all", period="12m", selMonth=null;

function newVehicle(name="Mein Wohnmobil"){return {id:uid(),name,fuel:"Diesel",tank:null,adblue:true,updatedAt:Date.now(),deleted:false}}
function stamp(o){o.updatedAt=Date.now();return o}
let saveT=null;
function persist(){clearTimeout(saveT);saveT=setTimeout(()=>{DB.set("state",S);syncSoon()},150)}
const vehicles=()=>S.vehicles.filter(v=>!v.deleted);
const curV=()=>vehicles().find(v=>v.id===S.settings.vehicleId)||vehicles()[0];
const cmpE=(a,b)=>a.date<b.date?-1:a.date>b.date?1:((a.odo??0)-(b.odo??0))||((a.createdAt||0)-(b.createdAt||0));
const ents=vid=>S.entries.filter(e=>!e.deleted&&e.vehicleId===vid).sort(cmpE);
const cost=e=>e.type==="stay"?(e.total||0):(e.total||0);
const catOf=e=>e.type==="fuel"?"Kraftstoff":e.type==="adblue"?"AdBlue":e.type==="stay"?"Stellplatz & Camping":(e.cat||"Sonstiges");

/* Verbrauch nach der Volltank-Methode: Menge seit der letzten Volltankung geteilt durch die gefahrene Strecke */
function series(es,type){
  const out=[];let last=null,acc=0;
  for(const e of es.filter(x=>x.type===type).sort(cmpE)){
    acc+=e.liters||0;
    if(e.full){
      if(last&&e.odo!=null&&last.odo!=null&&e.odo>last.odo){const dist=e.odo-last.odo;out.push({e,dist,liters:acc,rate:type==="fuel"?acc/dist*100:acc/dist*1000})}
      last=e;acc=0;
    }
  }
  return out;
}
function periodStart(p){
  if(p==="year")return new Date().getFullYear()+"-01-01";
  if(p==="12m")return addDays(todayISO(),-365);
  return "0000-00-00";
}
function summary(vid,p){
  const from=periodStart(p), all=ents(vid), es=all.filter(e=>e.date>=from);
  const total=es.reduce((s,e)=>s+cost(e),0);
  const odos=es.filter(e=>e.odo!=null).map(e=>e.odo);
  const dist=odos.length>1?Math.max(...odos)-Math.min(...odos):null;
  const fs=series(all,"fuel").filter(x=>x.e.date>=from), as=series(all,"adblue").filter(x=>x.e.date>=from);
  const fl=fs.reduce((s,x)=>s+x.liters,0), fd=fs.reduce((s,x)=>s+x.dist,0);
  const al=as.reduce((s,x)=>s+x.liters,0), ad=as.reduce((s,x)=>s+x.dist,0);
  const fuelL=es.filter(e=>e.type==="fuel").reduce((s,e)=>s+(e.liters||0),0);
  const fuelC=es.filter(e=>e.type==="fuel").reduce((s,e)=>s+(e.total||0),0);
  return {es,total,dist,perKm:dist?total/dist:null,cons:fd?fl/fd*100:null,adb:ad?al/ad*1000:null,fs,as,ppl:fuelL?fuelC/fuelL:null};
}

/* ---------- Demo-Daten ---------- */
function seedDemo(){
  let r=7;const rnd=()=>{r|=0;r=r+0x6D2B79F5|0;let t=Math.imul(r^r>>>15,1|r);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const between=(a,b)=>a+(b-a)*rnd();
  const v={id:"v-demo",name:"Wohnmobil (Beispiel)",fuel:"Diesel",tank:400,adblue:true,updatedAt:Date.now(),deleted:false};
  const out=[];const mk=(type,o)=>{const e=Object.assign({id:uid(),vehicleId:v.id,type,createdAt:out.length,updatedAt:Date.now(),deleted:false,demo:true},o);out.push(e);return e};
  const pool=[["Campingplatz Am Eichenhof","Campingplatz",38],["Stellplatz Hafenblick","Stellplatz",14],["Wohnmobilhafen Moselschleife","Stellplatz",16],["Camping Dünenrand","Campingplatz",46],["Stellplatz Weingut Lindner","Stellplatz",12],["Bergblick Camping","Campingplatz",41],["Stellplatz Altstadt","Stellplatz",15],["Camping Seeufer","Campingplatz",52],["Campingplatz Waldruh","Campingplatz",33]];
  let date="2025-09-02",odo=41830,defF=0,defA=0,fills=0,pi=0;
  const end=addDays(todayISO(),-4);
  const fill=(full)=>{
    const ppl=Math.round((1.64+0.14*Math.sin(out.length/5)+between(-.04,.05))*1000)/1000;
    let l=full?defF:defF*between(.45,.6);l=Math.round(l*100)/100;defF-=l;
    mk("fuel",{date,odo,liters:l,ppl,total:Math.round(l*ppl*100)/100,full,place:""});fills++;
  };
  defF=300;fill(true);defF=0;
  while(true){
    date=addDays(date,Math.round(between(13,27)));if(date>end)break;
    const km=Math.round(between(520,1450));odo+=km;
    const c=between(24.8,29.6);defF+=km*c/100;defA+=km*between(1.1,1.4)/100;
    const [name,kind,ppn]=pool[pi++%pool.length];const nights=Math.round(between(2,6));
    mk("stay",{date:addDays(date,-nights),odo:null,name,kind,nights,ppn,total:Math.round(nights*ppn*100)/100,rating:Math.round(between(3,5)),note:""});
    fill(rnd()>0.18);
    if(fills%3===0&&defA>8){const l=Math.round(defA*100)/100;const pa=between(0.85,1.05);mk("adblue",{date,odo,liters:l,ppl:Math.round(pa*100)/100,total:Math.round(l*pa*100)/100,full:true});defA=0}
    if(rnd()<.35)mk("expense",{date:addDays(date,-1),odo:null,cat:"Maut & Fähre",title:rnd()<.5?"Mautgebühr":"Fähre",total:Math.round(between(14,68)*100)/100});
    if(rnd()<.2)mk("expense",{date,odo:null,cat:"Gas & Betriebsmittel",title:"Gasflasche tauschen",total:28.5});
  }
  const y=new Date().getFullYear();
  mk("expense",{date:y+"-01-02",odo:null,cat:"Versicherung & Steuern",title:"Kfz-Versicherung Jahresbeitrag",total:1140});
  mk("expense",{date:y+"-03-14",odo:null,cat:"Wartung & Reparatur",title:"Inspektion Werkstatt",total:684.5});
  mk("expense",{date:y+"-04-02",odo:null,cat:"Wartung & Reparatur",title:"Dichtheitsprüfung Gasanlage",total:65});
  return {v,entries:out};
}

function monthsBack(n){

}

function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function drawCharts(){
  const cv=$("#cons");if(!cv)return;
  const s=summary(curV().id,period), pts=s.fs;if(pts.length<2)return;
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  const c=cv.getContext("2d");c.scale(dpr,dpr);c.clearRect(0,0,w,h);
  const L=44,R=16,T=16,B=28, bar=css("--bar"), muted=css("--ink-muted"), strong=css("--ink-strong"), grid=css("--border"), acc=css("--accent"), card=css("--surface-card");
  const ys=pts.map(x=>x.rate);let lo=Math.floor(Math.min(...ys,s.cons)-1),hi=Math.ceil(Math.max(...ys,s.cons)+1);
  const step=(hi-lo)>12?4:(hi-lo)>6?2:1;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const X=i=>L+(w-L-R)*(pts.length===1?.5:i/(pts.length-1)), Y=v=>T+(h-T-B)*(1-(v-lo)/(hi-lo));
  c.font='400 12px Lato, Calibri, Arial, sans-serif';c.textBaseline="middle";
  c.strokeStyle=grid;c.lineWidth=1;c.fillStyle=muted;c.textAlign="right";
  for(let v=lo;v<=hi;v+=step){const y=Math.round(Y(v))+.5;c.beginPath();c.moveTo(L,y);c.lineTo(w-R,y);c.stroke();c.fillText(String(v),L-8,y)}
  c.setLineDash([6,4]);c.strokeStyle=acc;c.lineWidth=1.5;c.beginPath();c.moveTo(L,Y(s.cons));c.lineTo(w-R,Y(s.cons));c.stroke();c.setLineDash([]);
  c.strokeStyle=bar;c.lineWidth=2;c.lineJoin="round";c.beginPath();pts.forEach((p,i)=>i?c.lineTo(X(i),Y(p.rate)):c.moveTo(X(i),Y(p.rate)));c.stroke();
  pts.forEach((p,i)=>{const last=i===pts.length-1;c.beginPath();c.arc(X(i),Y(p.rate),last?5:3,0,7);c.fillStyle=last?strong:card;c.fill();c.strokeStyle=last?strong:bar;c.lineWidth=2;c.stroke()});
  const lp=pts.at(-1);c.fillStyle=strong;c.font='700 12px Lato, Calibri, Arial, sans-serif';c.textAlign="right";
  c.fillText(fmt(lp.rate,1),X(pts.length-1)-8,Y(lp.rate)-(Y(lp.rate)<T+16?-14:14));
  c.font='400 12px Lato, Calibri, Arial, sans-serif';c.fillStyle=muted;c.textBaseline="alphabetic";
  const d1=pts[0].e.date,d2=lp.e.date,lab=d=>MON[+d.slice(5,7)-1]+" "+d.slice(2,4);
  c.textAlign="left";c.fillText(lab(d1),L,h-8);c.textAlign="right";c.fillText(lab(d2),w-R,h-8);
}

      ${onDelete?`<div class="btns" id="f-conf" hidden><button class="btn p grow" id="sh-yes">Endgültig löschen</button><button class="btn grow" id="sh-no">Abbrechen</button></div>`:""}
    </div></div>`;
  sheetEl.hidden=false;document.body.style.overflow="hidden";
  const err=m=>{const e=$("#sh-err");if(m){e.innerHTML=ico("warn",20)+`<span>${esc(m)}</span>`;e.hidden=false}else e.hidden=true};
  $("#sh-save").onclick=async()=>{err("");const r=await onSave(err);if(r!==false){closeSheet()}};
  if(onDelete){
    $("#sh-del").onclick=()=>{$("#f-main").hidden=true;$("#f-conf").hidden=false;$("#sh-no").focus()};
    $("#sh-no").onclick=()=>{$("#f-conf").hidden=true;$("#f-main").hidden=false;$("#sh-del").focus()};

  after&&after($(".pb"),err);
  $(".panel").focus();
}

let photoState={data:null,had:false,removed:false};
function bindPhoto(entry){
  photoState={data:null,had:!!entry?.photo,removed:false};
  const wrap=$("#ph-wrap"),btn=$("#ph-btn"),inp=$("#ph-in");
  const show=src=>{wrap.innerHTML=`<img src="${src}" alt="Belegfoto"><div style="display:flex;flex-direction:column;gap:8px"><button type="button" class="btn" id="ph-re">Ersetzen</button><button type="button" class="link" id="ph-rm" style="text-align:left">Entfernen</button></div><input type="file" id="ph-in" accept="image/*" class="sr">`;
    $("#ph-re").onclick=()=>$("#ph-in").click();$("#ph-rm").onclick=()=>{photoState.data=null;photoState.removed=true;reset()};wire()};
  const reset=()=>{wrap.innerHTML=`<button type="button" class="btn" id="ph-btn">${ico("cam",20)}<span>Foto aufnehmen oder auswählen</span></button><input type="file" id="ph-in" accept="image/*" class="sr">`;wire()};
  function wire(){
    const b=$("#ph-btn"),i=$("#ph-in");if(b)b.onclick=()=>i.click();
    i.onchange=async()=>{const f=i.files[0];if(!f)return;try{photoState.data=await shrink(f);photoState.removed=false;show(photoState.data)}catch(e){toast("Das Bild konnte nicht gelesen werden.")}};
  }
  wire();
  if(entry?.photo)DB.get("photo:"+entry.id).then(d=>{if(d&&!photoState.removed&&!photoState.data)show(d)});
}
async function shrink(file,max=1600){
  let bmp;
  try{bmp=await createImageBitmap(file)}catch(e){bmp=await new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>res(im);im.onerror=rej;im.src=u})}
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,sc=Math.min(1,max/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",.72);
}
async function commit(e,isNew){
  if(isNew){e.id=uid();e.createdAt=Date.now();e.deleted=false;S.entries.push(e)}
  else{const i=S.entries.findIndex(x=>x.id===e.id);S.entries[i]=Object.assign(S.entries[i],e)}
  const t=S.entries.find(x=>x.id===e.id);
  if(photoState.data){await DB.set("photo:"+t.id,photoState.data);t.photo=true;t.photoRev=uid().replace(/-/g,"").slice(0,8);await DB.set("photorev:"+t.id,t.photoRev)}
  else if(photoState.removed){await DB.del("photo:"+t.id);await DB.del("photorev:"+t.id);t.photo=false}
  stamp(t);persist();render();toast(isNew?"Eintrag gespeichert":"Änderung gespeichert");
}
async function removeEntry(e){const t=S.entries.find(x=>x.id===e.id);t.deleted=true;stamp(t);persist();render();toast("Eintrag gelöscht")}

/* Menge, Preis je Einheit und Gesamtbetrag: zwei Werte genügen, der dritte wird berechnet */
function bindTriple(root,initialOrder){
  const L=$("#f-l",root),P=$("#f-p",root),T=$("#f-t",root);let order=initialOrder||[];
  const dec={l:2,p:3,t:2};const el={l:L,p:P,t:T};
  const touch=k=>{order=order.filter(x=>x!==k);order.push(k)};
  function recompute(){
    const [a,b]=order.slice(-2);if(!a||!b)return;
    const tg=["l","p","t"].find(k=>k!==a&&k!==b), v={l:num(L.value),p:num(P.value),t:num(T.value)};
    let r=null;
    if(tg==="t"&&v.l>0&&v.p>0)r=v.l*v.p;
    if(tg==="p"&&v.l>0&&v.t>0)r=v.t/v.l;
    if(tg==="l"&&v.p>0&&v.t>0)r=v.t/v.p;
    if(r!=null)el[tg].value=toField(r,dec[tg]);
  }
  for(const k of ["l","p","t"])el[k].addEventListener("input",()=>{touch(k);recompute();root.dispatchEvent(new Event("calc"))});
}
function lastOdo(vid,excludeId){
  const es=ents(vid).filter(e=>e.odo!=null&&e.id!==excludeId);return es.at(-1);
}

function formFuel(entry){
  const v=curV(), isNew=!entry, e=entry||{date:todayISO(),full:true,type:"fuel"};
  const lo=lastOdo(v.id,e.id);

      ${F.sw("f-full","Voll getankt",e.full!==false)}

      ${F.field("f-pl","Tankstelle oder Ort (optional)",F.text("f-pl",e.place||"","z. B. Autohof"))}
      ${F.photo()}`,
    after(root){
      bindTriple(root,isNew?[]:["l","p"]);bindPhoto(e);
      const prev=()=>{
        const odo=intOf($("#f-o").value), l=num($("#f-l").value), full=$("#f-full").checked, box=$("#f-prev");
        const hint=$("#f-o-h");
        if(hint&&lo&&odo<lo.odo)hint.innerHTML=`<span class="w">Niedriger als der letzte Stand (${fmt(lo.odo)} km)</span>`;else if(hint&&lo)hint.textContent=`Zuletzt ${fmt(lo.odo)} km am ${fmtDate(lo.date)}`;
        if(!full){box.textContent="Teilbetankung: Der Verbrauch wird bei der nächsten Volltankung berechnet.";return}
        if(!(odo>0)||!(l>0)){box.textContent="Mit Kilometerstand und Menge wird der Verbrauch seit der letzten Volltankung berechnet.";return}
        const tmp={id:e.id||"tmp",type:"fuel",date:$("#f-d").value||todayISO(),odo,liters:l,full:true,createdAt:1e15};
        const list=ents(v.id).filter(x=>x.id!==e.id).concat([tmp]);
        const hit=series(list,"fuel").find(x=>x.e===tmp);
        box.innerHTML=hit?`Verbrauch seit der letzten Volltankung: <b>${fmt(hit.rate,1)} l/100 km</b> auf ${fmt(hit.dist)} km`:"Es gibt noch keine frühere Volltankung. Der Verbrauch wird ab der nächsten Volltankung berechnet.";
      };
      root.addEventListener("calc",prev);["f-o","f-d","f-full"].forEach(id=>$("#"+id).addEventListener("input",prev));$("#f-full").addEventListener("change",prev);prev();
    },
    async onSave(err){

async function exportData(){
  const photos={};for(const e of S.entries)if(e.photo&&!e.deleted){const d=await DB.get("photo:"+e.id);if(d)photos[e.id]=d}
  const json=JSON.stringify({app:"camper-repository",version:1,exportedAt:new Date().toISOString(),state:S,photos},null,1);
  const name="camper-repository-"+todayISO()+".json";
  try{
    /* Auf dem Telefon: Teilen-Fenster (Dateien, iCloud, Dropbox). Am PC: normaler Download. */
    const file=new File([json],name,{type:"application/json"});
    if(matchMedia("(pointer:coarse)").matches&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});toast("Sicherung bereit");return;
    }
  }catch(e){if(e&&e.name==="AbortError")return}
  try{
    const url=URL.createObjectURL(new Blob([json],{type:"application/json"}));
    const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Sicherung gespeichert");
  }catch(e){toast("Die Sicherung konnte nicht gespeichert werden.")}
}
async function importData(file){

    merge(S.vehicles,j.state.vehicles);merge(S.entries,j.state.entries);
    for(const [id,d] of Object.entries(j.photos||{}))if(!(await DB.get("photo:"+id))){await DB.set("photo:"+id,d);const en=S.entries.find(x=>x.id===id);if(en){if(!en.photoRev)en.photoRev="0";await DB.set("photorev:"+id,en.photoRev)}}

}

/* ---------- Abgleich über Dropbox ----------
   Jedes Gerät schreibt nur in seine eigene Datei (devices/<Geräte-ID>.json) und liest die Dateien der anderen.
   Zusammengeführt wird je Datensatz: höheres updatedAt gewinnt, bei Gleichstand die größere Geräte-ID.
   Belegfotos liegen einmal geschrieben unter photos/<Eintrag-ID>-<photoRev>.json. */
const DBX_KEY="7gcrpubuf57ogsc";
const dbxRedirect=()=>location.origin+location.pathname.replace(/index\.html$/,"");
const SYNC={cfg:null,state:"off",msg:"",busy:false,again:false,timer:null,panel:null};
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function pkcePair(){
  const v=b64u(crypto.getRandomValues(new Uint8Array(48)));
  const c=b64u(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
  return {v,c};
}
const saveCfg=()=>SYNC.cfg?DB.set("sync",SYNC.cfg):DB.del("sync");
const ago=t=>{
  const m=Math.round((Date.now()-t)/60000);
  if(m<1)return "gerade eben";if(m<60)return "vor "+m+" Min.";if(m<1440)return "vor "+Math.round(m/60)+" Std.";
  const d=new Date(t);return "am "+p2(d.getDate())+"."+p2(d.getMonth()+1)+".";
};

/* Anmeldung: OAuth mit PKCE, ohne Server. Das Geheimnis (code_verifier) bleibt auf dem Gerät. */
async function dbxPrepare(manual){
  const {v,c}=await pkcePair(), st=uid();
  const rec={v,st,manual:!!manual,t:Date.now()};
  await DB.set("pkce",rec);
  try{localStorage.setItem("cr-pkce",JSON.stringify(rec))}catch(e){}
  const q=new URLSearchParams({client_id:DBX_KEY,response_type:"code",code_challenge:c,code_challenge_method:"S256",token_access_type:"offline",state:st});
  if(!manual)q.set("redirect_uri",dbxRedirect());
  return "https://www.dropbox.com/oauth2/authorize?"+q;
}
async function dbxConnect(){
  try{location.href=await dbxPrepare(false)}catch(e){toast("Die Anmeldung konnte nicht gestartet werden.")}
}
async function dbxCodePanel(){
  try{SYNC.panel={url:await dbxPrepare(true)};render()}catch(e){toast("Die Anmeldung konnte nicht vorbereitet werden.")}
}
async function dbxExchange(code,rec){
  const body=new URLSearchParams({code:code.trim(),grant_type:"authorization_code",client_id:DBX_KEY,code_verifier:rec.v});
  if(!rec.manual)body.set("redirect_uri",dbxRedirect());
  const r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.refresh_token)throw new Error(j.error_description||j.error||"Anmeldung fehlgeschlagen");
  const dev=(await DB.get("device"))||uid();await DB.set("device",dev);
  SYNC.cfg={refresh:j.refresh_token,access:j.access_token,exp:Date.now()+Math.max(60,(j.expires_in||14400)-120)*1000,deviceId:dev,lastSync:null,lastHash:null};
  await saveCfg();await DB.del("pkce");try{localStorage.removeItem("cr-pkce")}catch(e){}
  SYNC.state="idle";SYNC.panel=null;
}
async function dbxToken(){
  const c=SYNC.cfg;
  if(c.access&&Date.now()<c.exp)return c.access;
  const r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({grant_type:"refresh_token",refresh_token:c.refresh,client_id:DBX_KEY})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.access_token){const e=new Error("auth");e.status=(r.status>=400&&r.status<500)?401:r.status;throw e}
  c.access=j.access_token;c.exp=Date.now()+Math.max(60,(j.expires_in||14400)-120)*1000;await saveCfg();
  return c.access;
}
async function dbxFetch(url,init,retry=true){
  const t=await dbxToken();
  const r=await fetch(url,Object.assign({},init,{headers:Object.assign({},init.headers,{Authorization:"Bearer "+t})}));
  if(r.status===401&&retry){SYNC.cfg.access=null;return dbxFetch(url,init,false)}
  return r;
}
async function dbxErr(r){const e=new Error("Dropbox "+r.status);e.status=r.status;e.body=await r.text().catch(()=>"");return e}
async function dbxRpc(path,arg){
  const r=await dbxFetch("https://api.dropboxapi.com/2/"+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(arg)});
  if(!r.ok)throw await dbxErr(r);return r.json();
}
async function dbxUp(path,text){
  const r=await dbxFetch("https://content.dropboxapi.com/2/files/upload",{method:"POST",
    headers:{"Content-Type":"application/octet-stream","Dropbox-API-Arg":JSON.stringify({path,mode:"overwrite",mute:true})},body:new Blob([text])});
  if(!r.ok)throw await dbxErr(r);
}
async function dbxDown(path){
  const r=await dbxFetch("https://content.dropboxapi.com/2/files/download",{method:"POST",headers:{"Dropbox-API-Arg":JSON.stringify({path})}});
  if(r.status===409&&/not_found/.test(await r.clone().text().catch(()=>"")))return null;
  if(!r.ok)throw await dbxErr(r);return r.text();
}
async function dbxList(path){
  let res;
  try{res=await dbxRpc("files/list_folder",{path,limit:2000})}
  catch(e){if(e.status===409&&/not_found/.test(e.body||""))return [];throw e}
  const out=[...res.entries];
  while(res.has_more){res=await dbxRpc("files/list_folder/continue",{cursor:res.cursor});out.push(...res.entries)}
  return out.filter(x=>x[".tag"]==="file").map(x=>x.name);
}

/* Was abgeglichen wird: keine Beispieldaten, kein unberührtes Standardfahrzeug */
function syncSet(){
  const real=S.entries.filter(e=>!e.demo);
  const vs=S.vehicles.filter(v=>{const has=real.some(e=>e.vehicleId===v.id);return !(v.id==="v-demo"&&!has)&&!(v.auto&&!has)});
  return {vehicles:vs,entries:real};
}
function mergeList(arr,inc,remoteDev,myDev){
  const idx=new Map(arr.map((x,i)=>[x.id,i]));let ch=0;
  for(const x of inc||[]){
    if(!x||!x.id||x.demo)continue;
    if(!idx.has(x.id)){arr.push(x);idx.set(x.id,arr.length-1);ch++;continue}
    const cur=arr[idx.get(x.id)], a=x.updatedAt||0, b=cur.updatedAt||0;
    if(a>b||(a===b&&remoteDev>myDev&&JSON.stringify(x)!==JSON.stringify(cur))){arr[idx.get(x.id)]=x;ch++}
  }
  return ch;
}
const photoName=(id,rev)=>"/photos/"+id+"-"+rev+".json";

async function syncRun(){
  const my=SYNC.cfg.deviceId;let changed=0;
  /* 1. Dateien der anderen Geräte lesen und zusammenführen */
  const files=(await dbxList("/devices")).filter(n=>n.endsWith(".json")&&n!==my+".json");
  for(const n of files){
    const txt=await dbxDown("/devices/"+n);if(!txt)continue;
    let j;try{j=JSON.parse(txt)}catch(e){continue}
    if(j.app!=="camper-repository"||!j.state)continue;
    const rd=j.deviceId||n.replace(/\.json$/,"");
    changed+=mergeList(S.vehicles,j.state.vehicles,rd,my);
    changed+=mergeList(S.entries,j.state.entries,rd,my);
  }
  if(!vehicles().length){S.vehicles.push(Object.assign(newVehicle(),{auto:true}));S.settings.vehicleId=S.vehicles.at(-1).id;changed++}
  if(!vehicles().some(v=>v.id===S.settings.vehicleId)){S.settings.vehicleId=vehicles()[0].id}
  /* 2. Belegfotos: fehlende laden, neue hochladen */
  const remote=new Set(await dbxList("/photos"));
  for(const e of S.entries){
    if(e.deleted||!e.photo||e.demo)continue;
    const rev=e.photoRev||(e.photoRev="0");
    const mark=await DB.get("photorev:"+e.id), have=await DB.get("photo:"+e.id);
    if(have&&mark==null){await DB.set("photorev:"+e.id,rev)}
    else if(mark!==rev||!have){
      const txt=await dbxDown(photoName(e.id,rev));if(!txt)continue;
      let j;try{j=JSON.parse(txt)}catch(x){continue}
      if(j&&j.data){await DB.set("photo:"+e.id,j.data);await DB.set("photorev:"+e.id,rev);changed++}
      continue;
    }
    const nm=e.id+"-"+rev+".json";
    if(!remote.has(nm)&&have){await dbxUp(photoName(e.id,rev),JSON.stringify({id:e.id,rev,data:have}));remote.add(nm)}
  }
  /* 3. Eigene Datei schreiben, wenn sich etwas geändert hat */
  const set=syncSet(), hash=JSON.stringify(set);
  if(hash!==SYNC.cfg.lastHash||!files.length&&!SYNC.cfg.lastSync){
    await dbxUp("/devices/"+my+".json",JSON.stringify({app:"camper-repository",version:2,deviceId:my,writtenAt:Date.now(),state:set}));
    SYNC.cfg.lastHash=hash;
  }
  if(changed){await DB.set("state",S)}
  return changed;
}
async function syncNow(manual){
  if(!SYNC.cfg)return;
  if(SYNC.busy){SYNC.again=true;return}
  if(!navigator.onLine){SYNC.state="offline";paintSync();if(manual)toast("Keine Verbindung. Der Abgleich folgt später.");return}
  SYNC.busy=true;SYNC.state="busy";paintSync();
  try{
    const n=await syncRun();
    SYNC.state="ok";SYNC.msg="";SYNC.cfg.lastSync=Date.now();await saveCfg();
    if(n)render();
    if(manual)toast(n?"Abgleich abgeschlossen, "+n+" Änderungen übernommen":"Abgleich abgeschlossen");
  }catch(e){
    if(e&&e.status===401){SYNC.state="auth"}
    else if(e instanceof TypeError||!navigator.onLine){SYNC.state="offline"}
    else{SYNC.state="error";SYNC.msg=(e&&e.status)?("Fehler "+e.status):""}
    if(manual)toast(SYNC.state==="auth"?"Die Anmeldung bei Dropbox ist abgelaufen.":SYNC.state==="offline"?"Dropbox ist nicht erreichbar.":"Der Abgleich ist fehlgeschlagen.");
  }finally{
    SYNC.busy=false;paintSync();
    if(SYNC.again){SYNC.again=false;syncSoon(800)}
  }
}
function syncSoon(ms=3000){
  if(!SYNC.cfg)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>syncNow(false),ms);
}
async function syncDisconnect(quiet){
  const c=SYNC.cfg;clearTimeout(SYNC.timer);SYNC.cfg=null;SYNC.state="off";SYNC.panel=null;
  await saveCfg();
  if(c&&c.access){fetch("https://api.dropboxapi.com/2/auth/token/revoke",{method:"POST",headers:{Authorization:"Bearer "+c.access}}).catch(()=>{})}
  paintSync();if(!quiet){render();toast("Dropbox getrennt. Die Daten auf diesem Gerät bleiben erhalten.")}
}

/* Anzeige */
function syncInfo(){
  const c=SYNC.cfg;if(!c)return null;
  const s=SYNC.busy?"busy":SYNC.state;
  if(s==="busy")return {cls:"busy",text:"Abgleich läuft …"};
  if(s==="ok")return {cls:"ok",text:"Dropbox aktuell · "+ago(c.lastSync||Date.now())};
  if(s==="offline")return {cls:"warn",text:"Dropbox nicht erreichbar, neuer Versuch folgt"+(c.lastSync?" · zuletzt "+ago(c.lastSync):"")};
  if(s==="auth")return {cls:"warn",text:"Anmeldung bei Dropbox abgelaufen. Unter „Mehr“ neu verbinden."};
  if(s==="error")return {cls:"warn",text:"Abgleich fehlgeschlagen"+(SYNC.msg?" ("+SYNC.msg+")":"")+(c.lastSync?" · zuletzt "+ago(c.lastSync):"")};
  return {cls:"busy",text:"Dropbox verbunden, Abgleich folgt"};
}
function syncBox(){
  const i=syncInfo();if(!i)return "";
  return `<div class="sync" data-syncbox role="status"><i class="dot ${i.cls}"></i><span>${esc(i.text)}</span></div>`;
}
function paintSync(){
  $$("[data-syncbox]").forEach(el=>{el.outerHTML=syncBox()});
  $$("[data-syncmeta]").forEach(el=>{const i=syncInfo();if(i)el.textContent=i.text});
}
function syncMoreHTML(){
  const c=SYNC.cfg,i=syncInfo();
  let h=`<div class="sec"><span class="slash"></span>Abgleich zwischen Geräten</div><div class="list">`;
  if(c){
    h+=`<div class="row static">${ico("cloud")}<div class="main"><div class="t">Dropbox</div><div class="m" data-syncmeta>${esc(i.text)}</div></div><span class="tag">verbunden</span></div>
    <button class="row" data-act="sync-now">${ico("up")}<div class="main"><div class="t">Jetzt abgleichen</div><div class="m">Liest die anderen Geräte ein und schreibt den eigenen Stand</div></div></button>
    <button class="row" data-act="sync-off">${ico("x")}<div class="main"><div class="t">Verbindung trennen</div><div class="m">Die Daten auf diesem Gerät und in Dropbox bleiben erhalten</div></div></button>`;
  }else{
    h+=`<button class="row" data-act="sync-on">${ico("cloud")}<div class="main"><div class="t">Dropbox verbinden</div><div class="m">Eigenes Konto, die App sieht nur ihren eigenen Ordner</div></div></button>
    <button class="row" data-act="sync-code">${ico("chev")}<div class="main"><div class="t">Anmeldung mit Code</div><div class="m">Falls die normale Anmeldung nicht zur App zurückkehrt</div></div></button>`;
    if(SYNC.panel){
      h+=`<div class="note" style="flex-direction:column;align-items:stretch"><p>1. Dropbox öffnen und den Zugriff erlauben. 2. Den angezeigten Code kopieren und hier einfügen.</p>
        <a class="btn" href="${esc(SYNC.panel.url)}" target="_blank" rel="noopener">Dropbox öffnen</a>
        <input class="in" id="dbx-code" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Code aus Dropbox" aria-label="Code aus Dropbox">
        <button class="btn p" data-act="sync-code-ok">Verbinden</button></div>`;
    }
  }
  h+=["Google Drive","OneDrive"].map(n=>`<div class="row static">${ico("cloud")}<div class="main"><div class="t">${n}</div><div class="m">Eigenes Konto verbinden</div></div><span class="tag">folgt</span></div>`).join("");
  return h+`</div>`;
}
async function dbxCodeSubmit(){
  const code=($("#dbx-code")?.value||"").trim();
  if(!code){toast("Bitte den Code aus Dropbox einfügen.");return}
  const rec=(await DB.get("pkce"))||(()=>{try{return JSON.parse(localStorage.getItem("cr-pkce"))}catch(e){return null}})();
  if(!rec){toast("Die Anmeldung wurde nicht vorbereitet. Bitte noch einmal starten.");return}
  try{await dbxExchange(code,Object.assign({},rec,{manual:true}));render();toast("Dropbox verbunden");syncSoon(300)}
  catch(e){toast("Der Code wurde nicht akzeptiert.")}
}
async function syncInit(){
  SYNC.cfg=(await DB.get("sync"))||null;
  if(SYNC.cfg)SYNC.state="idle";
  /* Rückkehr von der Dropbox-Anmeldung */
  const q=new URLSearchParams(location.search);
  if(q.has("code")||q.has("error")){
    const clean=()=>{try{history.replaceState(null,"",dbxRedirect())}catch(e){}};
    const rec=(await DB.get("pkce"))||(()=>{try{return JSON.parse(localStorage.getItem("cr-pkce"))}catch(e){return null}})();
    if(q.has("error")){clean();toast("Die Anmeldung bei Dropbox wurde abgebrochen.")}
    else if(!rec||rec.st!==q.get("state")){clean();toast("Die Anmeldung passt nicht zu dieser Sitzung. Bitte noch einmal starten.")}
    else{
      try{await dbxExchange(q.get("code"),rec);clean();tab="more";render();toast("Dropbox verbunden")}
      catch(e){clean();toast("Die Anmeldung bei Dropbox ist fehlgeschlagen.")}
    }
  }
  paintSync();
  if(SYNC.cfg)syncSoon(500);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncSoon(800)});
  window.addEventListener("online",()=>syncSoon(500));
  setInterval(paintSync,60000);
}

/* ---------- Start ---------- */
(async function init(){
  $$("[data-ico]").forEach(el=>el.innerHTML=ico(el.dataset.ico));
  await DB.open();
  let st=await DB.get("state");
  if(!st||!st.vehicles){
    const d=seedDemo();st={v:1,vehicles:[d.v],entries:d.entries,settings:{vehicleId:d.v.id,demo:true}};await DB.set("state",st);
  }
  S=st;
  if(!vehicles().length){S.vehicles.push(Object.assign(newVehicle(),{auto:true}));S.settings.vehicleId=S.vehicles.at(-1).id}
  try{await document.fonts.ready}catch(e){}
  render();
  if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  await syncInit();
  window.__app={get S(){return S},SYNC,syncNow,syncRun,syncSet,series,summary,ents,seedDemo,num,go,openNew};
})();
</script>
